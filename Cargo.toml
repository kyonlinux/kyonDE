[workspace]
resolver = "3"
members = ["kyon-ipc", "kyonde", "kyonshell", "kyonctl"]
exclude = ["smithay"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
authors = ["KyonDE contributors"]

[workspace.dependencies]
kyon-ipc = { path = "kyon-ipc" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
calloop = "0.14.5"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true
debug = false
